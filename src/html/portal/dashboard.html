<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五大湖联合大学 RoboMaster 2026 - 主页</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div class="header-content">
                <h1>五大湖联合大学 RoboMaster 2026</h1>
                <button id="logoutBtn" class="logout-btn">退出登录</button>
            </div>
        </header>
        
        <div class="dashboard-layout">
            <!-- 侧边栏导航 -->
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item active">
                        <span class="nav-icon">🏠</span>
                        <span class="nav-text">主页</span>
                    </a>
                    <a href="project-docs.html" class="nav-item">
                        <span class="nav-icon">📄</span>
                        <span class="nav-text">项目文档</span>
                    </a>
                    <a href="robot-status.html" class="nav-item">
                        <span class="nav-icon">🎬</span>
                        <span class="nav-text">兵种情况</span>
                    </a>
                    <a href="robot-planning.html" class="nav-item">
                        <span class="nav-icon">🤖</span>
                        <span class="nav-text">兵种规划</span>
                    </a>
                    <a href="meeting-minutes.html" class="nav-item">
                        <span class="nav-icon">📝</span>
                        <span class="nav-text">会议纪要</span>
                    </a>
                </nav>
            </aside>
            
            <!-- 主内容区 -->
            <main class="main-content">
                <div class="welcome-section">
                    <h2>欢迎，<span id="userName"></span>！</h2>
                </div>
                
                <div class="countdown-section">
                    <h3>中期文档提交截止时间倒计时</h3>
                    <div class="deadline-info">
                        <p class="deadline-text">截止时间：2026年1月29日 15:00 (北京时间)</p>
                    </div>
                    <div class="countdown-display">
                        <div class="countdown-item">
                            <span id="days" class="countdown-number">0</span>
                            <span class="countdown-label">天</span>
                        </div>
                        <div class="countdown-item">
                            <span id="hours" class="countdown-number">0</span>
                            <span class="countdown-label">小时</span>
                        </div>
                        <div class="countdown-item">
                            <span id="minutes" class="countdown-number">0</span>
                            <span class="countdown-label">分钟</span>
                        </div>
                        <div class="countdown-item">
                            <span id="seconds" class="countdown-number">0</span>
                            <span class="countdown-label">秒</span>
                        </div>
                    </div>
                    <div id="deadline-status" class="deadline-status"></div>
                </div>
            </main>
        </div>
        
        <footer>
            <p>© 2026 Illinois RoboMaster. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="dashboard.js"></script>
</body>
</html>
