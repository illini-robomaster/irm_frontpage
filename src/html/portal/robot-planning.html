<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兵种规划 - 五大湖联合大学 RoboMaster 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div class="header-content">
                <h1>五大湖联合大学 RoboMaster 2026</h1>
                <button id="logoutBtn" class="logout-btn">退出登录</button>
            </div>
        </header>
        
        <div class="dashboard-layout">
            <!-- 侧边栏导航 -->
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item">
                        <span class="nav-icon">🏠</span>
                        <span class="nav-text">主页</span>
                    </a>
                    <a href="project-docs.html" class="nav-item">
                        <span class="nav-icon">📄</span>
                        <span class="nav-text">项目文档</span>
                    </a>
                    <a href="robot-status.html" class="nav-item">
                        <span class="nav-icon">🎬</span>
                        <span class="nav-text">兵种情况</span>
                    </a>
                    <a href="robot-planning.html" class="nav-item active">
                        <span class="nav-icon">🤖</span>
                        <span class="nav-text">兵种规划</span>
                    </a>
                    <a href="meeting-minutes.html" class="nav-item">
                        <span class="nav-icon">📝</span>
                        <span class="nav-text">会议纪要</span>
                    </a>
                </nav>
            </aside>
            
            <!-- 主内容区 -->
            <main class="main-content">
                <div class="page-header">
                    <h2>兵种规划</h2>
                    <div class="header-actions">
                        <div class="robot-stats" id="robotStats"></div>
                        <button id="addRobotBtn" class="action-btn">+ 新增兵种</button>
                        <button id="editModeBtn" class="action-btn">进入编辑模式</button>
                    </div>
                </div>
                
                <!-- 新造兵种区域 -->
                <div class="section-container">
                    <div class="section-header">
                        <h3>🔨 新造兵种</h3>
                        <span class="section-count" id="newRobotCount">0</span>
                    </div>
                    <div class="robot-grid" id="newRobotsGrid">
                        <!-- 动态加载新造机器人卡片 -->
                    </div>
                </div>
                
                <!-- 库存兵种区域 -->
                <div class="section-container">
                    <div class="section-header">
                        <h3>📦 库存兵种</h3>
                        <span class="section-count" id="stockRobotCount">0</span>
                    </div>
                    <div class="robot-grid" id="stockRobotsGrid">
                        <!-- 动态加载库存机器人卡片 -->
                    </div>
                </div>
            </main>
        </div>
        
        <footer>
            <p>© 2026 Illinois RoboMaster. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="common.js"></script>
    <script src="robot-planning-data.js"></script>
    <script src="robot-planning.js"></script>
</body>
</html>
